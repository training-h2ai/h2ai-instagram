name: Refresh Instagram token

# Long-lived Instagram tokens expire after 60 days. This refreshes it every
# Monday and saves the new token back into the IG_ACCESS_TOKEN secret.
# Needs a second secret, GH_PAT: a fine-grained GitHub token for this repo
# with "Secrets: Read and write" permission.

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT secret is missing, so the token can't be saved. See SETUP.md step 6."
            exit 1
          fi
          RESP=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          NEW=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$NEW" ]; then
            echo "::error::Refresh failed: $(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('error',d))")"
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Token refreshed and saved."
